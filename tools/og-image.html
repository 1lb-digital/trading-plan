<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share image source</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Rendered to ../og-image.png at 1200x630 with headless Chrome. Mark: og-mark.png, cut from icon-source.png. */
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0B0B0B}
.wrap{position:relative;width:1200px;height:630px;display:flex}
.mark{width:630px;height:630px;background:url(og-mark.png) center/cover;flex:none}
.fade{position:absolute;left:580px;top:0;width:50px;height:630px;background:linear-gradient(90deg,rgba(11,11,11,0),#0B0B0B)}
.text{position:relative;padding:0 64px 0 12px;display:flex;flex-direction:column;justify-content:center}
.kicker{font:500 16px 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:#FBAF17;margin:0 0 22px}
h1{font:800 76px/0.98 'Bricolage Grotesque',sans-serif;letter-spacing:-.025em;color:#FDFBF7;margin:0 0 26px}
p{font:400 25px/1.38 'IBM Plex Sans',sans-serif;color:#B9B9B4;margin:0}
.url{font:500 17px 'IBM Plex Mono',monospace;color:#7D7D78;margin-top:34px}
</style>
</head>
<body>
<div class="wrap">
  <div class="mark"></div>
  <div class="fade"></div>
  <div class="text">
    <p class="kicker">Learn first. Test second. Risk last.</p>
    <h1>The 90 Day Trading Plan</h1>
    <p>A step by step guide to testing a day trading method with paper money before you risk any real money.</p>
    <div class="url">1lb-digital.github.io/trading-plan</div>
  </div>
</div>
</body>
</html>
